name: Windows build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"
jobs:
  windows:
    name: Windows x64 / native tools and browser
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows_preflight.ps1
      - run: python scripts/bootstrap.py
      - run: python scripts/manage.py build --debug
      - run: python scripts/manage.py check
      - name: Native Windows static-tool regression
        run: |
          $env:AEGIS_NATIVE_SAST_EVIDENCE = Join-Path $PWD '.data/verification/native-sast'
          python scripts/aegis.py cargo test --workspace --locked native_ -- --ignored --test-threads=1
      - run: python scripts/manage.py doctor
      - run: python scripts/aegis.py pnpm --dir frontend exec playwright install chromium
      - run: python scripts/e2e.py --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          include-hidden-files: true
          path: |
            .data/windows/preflight-*.json
            .data/verification/browser-results.json
            .data/verification/browser-server.log
            .data/verification/browser-executor.log
            .data/verification/native-sast/
            frontend/test-results/
