[workspace]
members = ["crates/domain", "crates/application", "crates/protocol", "crates/server", "crates/executor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
aegis-domain = { path = "crates/domain" }
aegis-application = { path = "crates/application" }
aegis-protocol = { path = "crates/protocol" }
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
buffa = { version = "=0.9.1", features = ["json"] }
buffa-types = { version = "=0.9.1", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
connectrpc = { version = "=0.9.0", features = ["axum", "client", "client-tls"] }
futures = "0.3"
hex = "0.4"
libc = "0.2"
object = { version = "0.37", features = ["read"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
unicode-normalization = "0.1"
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = "debuginfo"
